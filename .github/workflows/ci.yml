# 단위 시험과 웹 콘솔 빌드. 외부 네트워크(패키지 설치 제외)·비밀값·Docker 가 필요 없다.
#
# 파이썬은 지원 범위(pyproject.toml 의 requires-python) 안의 판을 모두 돌린다.
# 런타임 이미지는 Dockerfile 의 3.12 를 쓰므로 3.12 도 매트릭스에 들어 있다.
# 잠금 파일이 없어 매번 새로 받는다. 의존성이 조용히 올라가면 여기서 먼저 드러난다.
# Docker 로 시험용 PostgreSQL 을 띄우는 격리 점검은 integration.yml 에 있다.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 같은 곳에 연달아 밀면 앞의 실행은 접는다. 마지막 것만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: typecheck and build console
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: test
        run: pytest -q
